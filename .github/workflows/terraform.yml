name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.17.1
  AWS_REGION: us-east-1

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  foundation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  workload-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/workload
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      ##
      - name: Check role ARN shape (temporary)
        env:
          ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          echo "length: ${#ROLE}"
          echo "digits hidden: $(echo "$ROLE" | tr -d '\r' | sed -E 's/[0-9]/N/g')"
          if [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "format: ok"
          else
            echo "format: BAD"
          fi

      - name: Inspect OIDC token sub (temporary)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$RESP" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.value)")
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}')
          echo "$PAYLOAD" | base64 -d 2>/dev/null || echo "$PAYLOAD" | python3 -m base64 -d
          echo ""
      ##
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=60s

  workload-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets-scan, foundation-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: terraform-workload-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/workload
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      ##
      - name: Check role ARN shape (temporary)
        env:
          ROLE: ${{ secrets.AWS_APPLY_ROLE_ARN }}
        run: |
          echo "length: ${#ROLE}"
          echo "digits hidden: $(echo "$ROLE" | tr -d '\r' | sed -E 's/[0-9]/N/g')"
          if [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "format: ok"
          else
            echo "format: BAD"
          fi

      - name: Inspect OIDC token sub (temporary)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$RESP" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.value)")
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}')
          echo "$PAYLOAD" | base64 -d 2>/dev/null || echo "$PAYLOAD" | python3 -m base64 -d
          echo ""
      ##
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -lockfile=readonly
      - run: terraform apply -input=false -auto-approve -lock-timeout=300s
